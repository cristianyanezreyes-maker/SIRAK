<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIRAK · Evaluaciones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--az:#1f5192;--vd:#8dc63f;--bg:#f3f6fa;--tx:#1d2733;--ln:#d9e0ea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial;background:var(--bg);color:var(--tx)}
header{background:#fff;border-bottom:4px solid var(--vd);display:flex;align-items:center;gap:14px;padding:8px 18px;flex-wrap:wrap}
header img{height:48px}header b{color:var(--az);font-size:18px}header .sp{flex:1}
nav button{background:none;border:0;padding:10px 14px;font-size:15px;cursor:pointer;color:var(--az);border-bottom:3px solid transparent}nav button.on{border-color:var(--az);font-weight:700}
main{max-width:1100px;margin:18px auto;padding:0 14px}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
h2,h3{color:var(--az);margin:.2em 0 .6em}
button.b,.b{background:var(--az);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-size:14px}.b.g{background:#6b7785}.b.r{background:#c0392b}.b.v{background:#4d8f1c}.b.s{padding:4px 9px;font-size:12px}
input,select,textarea{width:100%;padding:8px;border:1px solid #b9c4d2;border-radius:6px;font:inherit;margin:3px 0 9px}textarea{min-height:70px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--ln);padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3f9;color:var(--az)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:200px}
.tag{display:inline-block;background:#e6f1d6;border-radius:12px;padding:2px 9px;font-size:12px;margin:2px}.bad{background:#fbe0dd}
.ok{color:#2e7d32;font-weight:700}.no{color:#c0392b;font-weight:700}
.bar{background:#e3e8ef;border-radius:6px;height:14px}.bar i{display:block;height:100%;border-radius:6px;background:var(--vd)}
.nota{font-size:42px;font-weight:800;color:var(--az)}
#login{max-width:380px;margin:50px auto;text-align:center}#login img{width:230px}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.nav button{width:36px;height:34px;border:1px solid #9aa8ba;background:#fff;border-radius:6px;cursor:pointer}.nav .done{background:#cfe8ab}.nav .cur{outline:3px solid var(--az)}
.opt{display:block;border:1px solid var(--ln);border-radius:8px;padding:10px;margin:6px 0;cursor:pointer}.opt.sel{background:#dce9fb;border-color:var(--az)}
.noselect{user-select:none;-webkit-user-select:none}.noselect textarea{user-select:text;-webkit-user-select:text}
#warn{position:fixed;inset:0;background:rgba(160,20,20,.93);color:#fff;display:none;align-items:center;justify-content:center;text-align:center;z-index:99;padding:30px;font-size:20px}
.msg{color:#c0392b;min-height:20px}
</style></head><body>
<div id="ld" style="display:none;position:fixed;top:0;right:0;background:#1f5192;color:#fff;padding:5px 14px;border-radius:0 0 0 8px;z-index:98;font-size:13px">Cargando…</div>
<div id="warn"><div><h2 style="color:#fff">⚠ Salida de la evaluación detectada</h2><p>Se registró que abandonó la ventana/pantalla completa. Cada evento queda en el informe de la administración.</p><button class="b g" onclick="warn.style.display='none';goFull()">Volver a la evaluación</button></div></div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ====== CONFIGURACIÓN: URL ya configurada == */
const API_URL='https://script.google.com/macros/s/AKfycbz04KxJ4h854OLedZjhR9CjkhJfO1hmvLzNhK_lnq5O0CsA1DeGtF--OVhjyvjBhB4TBQ/exec';
/* ================================================================================== */
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={token:sessionStorage.getItem('tk'),user:null,tab:''},EX=null;
const fd=t=>t?new Date(Number(t)).toLocaleString('es-CL',{timeZone:'America/Santiago'}):'-',dur=s=>Math.floor(s/60)+'m '+Math.round(s%60)+'s';
let LD=0;const ld=n=>{LD+=n;const e=$('ld');if(e)e.style.display=LD>0?'block':'none'};
async function api(action,d={}){ld(1);try{const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,token:S.token,...d})});const j=await r.json();if(!j.ok)throw new Error(j.error);return j.data}finally{ld(-1)}}
const offs=u=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Santiago',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(u)).reduce((o,x)=>(o[x.type]=x.value,o),{});return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(u/1000)*1000};
const chMs=s=>{const[a,t]=s.split('T'),[y,m,d]=a.split('-').map(Number),[H,M]=t.split(':').map(Number),L=Date.UTC(y,m-1,d,H,M);let u=L;for(let i=0;i<3;i++)u=L-offs(u);return u};
const fc=v=>/^\d{10,}$/.test(String(v))?fd(v):String(v).replace('T',' ');
const T=async f=>{try{return await f()}catch(e){alert(e.message)}};
function shell(tabs,body){$('app').innerHTML=`<header><img src="logo.png"><b>Plataforma de Evaluaciones</b><span class="sp"></span><nav>${tabs.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><span>${esc(S.user.nombre)}</span><button class="b g s" onclick="logout()">Salir</button></header><main id="m">${body||''}</main>`}
function logout(){sessionStorage.clear();S.token=null;boot()}
async function boot(){
  if(S.token){try{S.user=await api('yo');return S.user.cambiar?forzar():go(S.user.rol==='admin'?'res':'mis')}catch(e){S.token=null}}
  $('app').innerHTML=`<div id="login" class="card"><img src="logo.png"><h2>Ingreso</h2><input id="u" placeholder="Usuario"><input id="c" type="password" placeholder="Clave"><div class="msg" id="e"></div><button class="b" style="width:100%" onclick="doLogin()">Ingresar</button><p><a href="#" onclick="recu();return false">Olvidé mi clave</a></p></div>`}
async function doLogin(){try{const r=await api('login',{usuario:$('u').value,clave:$('c').value});S.token=r.token;sessionStorage.setItem('tk',r.token);boot()}catch(e){$('e').textContent=e.message}}
async function recu(){const u=prompt('Ingrese su usuario. La administración recibirá la solicitud y le asignará una clave nueva.');if(u)T(async()=>alert(await api('recuperar',{usuario:u})))}
function forzar(){$('app').innerHTML=`<div id="login" class="card"><img src="logo.png"><h3>Debe cambiar su clave</h3>${passForm()}</div>`}
function passForm(){return `<input id="pa" type="password" placeholder="Clave actual"><input id="pn" type="password" placeholder="Clave nueva (mín. 8)"><button class="b" onclick="chPass()">Cambiar clave</button>`}
function chPass(){T(async()=>{await api('cambiarClave',{actual:$('pa').value,nueva:$('pn').value});alert('Clave actualizada');S.user.cambiar=false;boot()})}
function go(t){S.tab=t;const adm=S.user.rol==='admin';
  shell(adm?[['res','Resultados'],['ev','Evaluaciones'],['us','Usuarios'],['as','Habilitar instrumentos'],['cu','Mi cuenta']]:[['mis','Mis evaluaciones'],['inf','Mis informes'],['cu','Mi cuenta']]);
  ({res:vRes,ev:vEv,us:vUs,as:vAs,cu:vCu,mis:vMis,inf:vInf})[t]()}
async function vCu(){let ia='';if(S.user.rol=='admin'){const s=await api('iaEstado');ia=`<div class="card" style="max-width:520px"><h2>Clave de IA (Groq)</h2><p>Estado: <b>${s.ok?'configurada':'sin configurar'}</b></p><p class="no">⚠ Cambiar solo si es estrictamente necesario. Si la IA funciona, no la toque.</p>${S.user.principal?'<input id="gk" placeholder="gsk_..."><button class="b g" onclick="gkSave()">Actualizar clave</button>':'<small>Solo la administradora principal puede actualizarla.</small>'}</div>`}
$('m').innerHTML=`<div class="card" style="max-width:420px"><h2>Cambiar mi clave</h2>${passForm()}</div>`+ia}
const gkSave=()=>{if(confirm('¿Seguro que desea reemplazar la clave de IA?'))T(async()=>{await api('iaClave',{clave:$('gk').value});alert('Clave actualizada');vCu()})};

/* ===== ADMIN: USUARIOS ===== */
let US=[];const SITIO=()=>location.href.split(/[?#]/)[0];
async function vUs(){const us=US=await api('usuarios');$('m').innerHTML=`<div class="card"><h2>Crear usuario</h2><div class="row"><div>Nombre<input id="n"></div><div>Usuario<input id="un"></div><div>Perfil<select id="ro"><option value="pro">Profesional</option>${S.user.principal?'<option value="admin">Administrador</option>':''}</select></div><div>Correo (opcional)<input id="co" type="email"></div><div>Clave (vacía = automática)<input id="cl" placeholder="mín. 8"></div></div><label><input type="checkbox" id="cm" checked style="width:auto"> Obligar a cambiar la clave al ingresar</label> <label><input type="checkbox" id="ce" style="width:auto"> Enviar clave por correo</label><br><button class="b" onclick="uCr()">Crear</button></div>
<div class="card"><h2>Usuarios</h2><table><tr><th>Nombre</th><th>Usuario</th><th>Correo</th><th>Perfil</th><th>Estado</th><th></th></tr>${us.map(u=>`<tr><td>${esc(u.nombre)} ${u.principal?'<span class="tag">principal</span>':''}${u.recup==='SI'?'<span class="tag bad">pidió recuperar clave</span>':''}</td><td>${esc(u.usuario)}</td><td>${esc(u.correo||'')}</td><td>${u.rol=='admin'?'Administrador':'Profesional'}</td><td>${u.bloqueado?'<span class="no">Bloqueado</span>':'Activo'}</td><td>${u.principal?'':`<button class="b s g" onclick="uBl('${u.id}',${!u.bloqueado})">${u.bloqueado?'Desbloquear':'Bloquear'}</button> <button class="b s" onclick="uCl('${u.id}')">Asignar clave</button> <button class="b s r" onclick="uDe('${u.id}')">Eliminar</button>`}</td></tr>`).join('')}</table></div>`}
const uRes=r=>alert((r.clave?'Clave generada (cópiela ahora): '+r.clave+'\n':'')+(r.enviado?'Clave enviada por correo.':'No se envió correo.'));
const uCr=()=>T(async()=>{const c=$('cl').value.trim();uRes(await api('uCrear',{nombre:$('n').value,usuario:$('un').value,rol:$('ro').value,clave:c,correo:$('co').value,enviar:$('ce').checked,cambiar:$('cm').checked||!c,sitio:SITIO()}));vUs()});
const uBl=(id,b)=>T(async()=>{await api('uBloquear',{id,bloqueado:b});vUs()});
const uCl=id=>{const c=prompt('Clave nueva (mín. 8). Déjela vacía para generar una automática.');if(c===null)return;let co=(US.find(x=>x.id==id)||{}).correo||'',env=false;
  if(co)env=confirm('¿Enviar la clave por correo a '+co+'?');else if(confirm('Este usuario no tiene correo. ¿Desea ingresarlo para enviarle la clave?')){co=prompt('Correo:')||'';env=!!co}
  T(async()=>{uRes(await api('uClave',{id,clave:c.trim(),correo:co,enviar:env,cambiar:true,sitio:SITIO()}));vUs()})};
const uDe=id=>{if(confirm('¿Eliminar usuario?'))T(async()=>{await api('uEliminar',{id});vUs()})};

/* ===== ADMIN: HORARIOS ===== */
async function vAs(){const[ev,us,as]=await Promise.all([api('evals'),api('usuarios'),api('asigs')]);
  $('m').innerHTML=`<div class="card"><h2>Habilitar instrumentos</h2>Instrumento<select id="ae">${ev.map(e=>`<option value="${e.id}">${esc(e.titulo)}</option>`).join('')}</select>
<div class="row"><div>Inicio (hora de Chile)<input type="datetime-local" id="ai"></div><div>Término (hora de Chile)<input type="datetime-local" id="af"></div></div>
<label><input type="checkbox" id="at" style="width:auto"> Todos los profesionales</label><div>${us.filter(u=>u.rol=='pro').map(u=>`<label style="display:inline-block;width:240px"><input type="checkbox" class="au" value="${u.id}" style="width:auto"> ${esc(u.nombre)}</label>`).join('')}</div><br><button class="b" onclick="asg()">Habilitar</button></div>
<div class="card"><h2>Instrumentos habilitados</h2><table><tr><th>Evaluación</th><th>Funcionario</th><th>Inicio</th><th>Término</th><th></th></tr>${as.map(a=>`<tr><td>${esc(a.evaluacion)}</td><td>${esc(a.usuario)}</td><td>${fc(a.inicio)}</td><td>${fc(a.fin)}</td><td><button class="b s r" onclick="asDe('${a.id}')">Quitar</button></td></tr>`).join('')}</table></div>`}
const asg=()=>T(async()=>{const ids=$('at').checked?['*']:[...document.querySelectorAll('.au:checked')].map(x=>x.value);if(!ids.length||!$('ai').value||!$('af').value)throw Error('Complete fechas y funcionarios');const i=chMs($('ai').value),f=chMs($('af').value);if(f<=i)throw Error('El término debe ser posterior al inicio');await api('asignar',{evalId:$('ae').value,userIds:ids,inicio:i,fin:f});vAs()});
const asDe=id=>T(async()=>{await api('asigEliminar',{id});vAs()});

/* ===== ADMIN: EVALUACIONES (instrumentos, objetivos, habilidades, preguntas) ===== */
let EV=[],ED=null;
async function vEv(){EV=await api('evals');$('m').innerHTML=`<div class="card"><h2>Instrumentos</h2><button class="b v" onclick="edit(null)">+ Nueva evaluación</button> <input type="file" id="fi" accept=".docx,.pdf" style="display:none" onchange="imp(this)"><button class="b g" onclick="$('fi').click()">Importar Word/PDF con IA</button><table style="margin-top:10px"><tr><th>Título</th><th>Preguntas</th><th></th></tr>${EV.map(e=>`<tr><td>${esc(e.titulo)}</td><td>${e.preguntas.length}</td><td><button class="b s" onclick="edit('${e.id}')">Revisar / editar</button> <button class="b s g" onclick="pdfInst('${e.id}',true)">PDF con pauta</button> <button class="b s g" onclick="pdfInst('${e.id}',false)">PDF sin pauta</button> <button class="b s r" onclick="evDe('${e.id}')">Eliminar</button></td></tr>`).join('')}</table></div><div id="ed"></div>`}
const evDe=id=>{if(confirm('¿Eliminar instrumento y sus preguntas?'))T(async()=>{await api('evalEliminar',{id});vEv()})};
function edit(id){const e=EV.find(x=>x.id==id);ED=e?{id:e.id,titulo:e.titulo,objetivos:e.objetivos,habilidades:JSON.parse(e.habilidades),duracion:e.duracion,preguntas:e.preguntas.map(p=>({...p,opciones:JSON.parse(p.opciones||'[]'),justificar:p.justificar==='TRUE'}))}:{titulo:'',objetivos:'',habilidades:[],duracion:60,preguntas:[]};drawEd();$('ed').scrollIntoView()}
function drawEd(){const e=ED;$('ed').innerHTML=`<div class="card"><h2>${e.id?'Editar':'Nuevo'} instrumento</h2>Título<input id="et" value="${esc(e.titulo)}">Objetivo(s) (obligatorio)<textarea id="eo">${esc(e.objetivos)}</textarea>Habilidades evaluadas, separadas por coma (obligatorio)<input id="eh" value="${esc(e.habilidades.join(', '))}" onchange="syncH()">Duración (minutos)<input id="ed2" type="number" value="${e.duracion}">
<h3>Preguntas</h3>${e.preguntas.map((p,i)=>`<div class="card" style="background:#fafcff"><b>#${i+1}</b> <button class="b s r" style="float:right" onclick="qDe(${i})">Quitar</button>
<div class="row"><div>Sección<input value="${esc(p.seccion)}" onchange="ED.preguntas[${i}].seccion=this.value"></div><div>Tipo<select onchange="ED.preguntas[${i}].tipo=this.value;drawEd()"><option value="VF" ${p.tipo=='VF'?'selected':''}>Verdadero/Falso</option><option value="ALT" ${p.tipo=='ALT'?'selected':''}>Alternativas</option><option value="DES" ${p.tipo=='DES'?'selected':''}>Desarrollo</option></select></div><div>Habilidad<select onchange="ED.preguntas[${i}].habilidad=this.value">${e.habilidades.map(h=>`<option ${h==p.habilidad?'selected':''}>${esc(h)}</option>`).join('')}</select></div><div>Puntaje<input type="number" value="${p.puntaje}" onchange="ED.preguntas[${i}].puntaje=this.value"></div></div>
Enunciado<textarea onchange="ED.preguntas[${i}].enunciado=this.value">${esc(p.enunciado)}</textarea>
${p.tipo=='ALT'?`Alternativas (una por línea)<textarea onchange="ED.preguntas[${i}].opciones=this.value.split('\\n').filter(Boolean)">${esc(p.opciones.join('\n'))}</textarea>Correcta (n° de alternativa: 0 = primera)<input value="${esc(p.correcta)}" onchange="ED.preguntas[${i}].correcta=this.value">`:''}
${p.tipo=='VF'?`Correcta<select onchange="ED.preguntas[${i}].correcta=this.value"><option ${p.correcta=='V'?'selected':''}>V</option><option ${p.correcta=='F'?'selected':''}>F</option></select><label><input type="checkbox" style="width:auto" ${p.justificar?'checked':''} onchange="ED.preguntas[${i}].justificar=this.checked"> Pedir justificación si responde F</label>`:''}
${p.tipo=='DES'?`Pauta de corrección<textarea onchange="ED.preguntas[${i}].correcta=this.value">${esc(p.correcta)}</textarea>`:''}</div>`).join('')}
<button class="b g" onclick="qAd()">+ Añadir pregunta</button> <button class="b v" onclick="evSave()">Guardar instrumento</button></div>`}
function syncH(){ED.habilidades=$('eh').value.split(',').map(x=>x.trim()).filter(Boolean);head();drawEd()}
function head(){ED.titulo=$('et').value;ED.objetivos=$('eo').value;ED.duracion=$('ed2').value;ED.habilidades=$('eh').value.split(',').map(x=>x.trim()).filter(Boolean)}
function qAd(){head();ED.preguntas.push({seccion:'',tipo:'VF',enunciado:'',opciones:[],correcta:'V',habilidad:ED.habilidades[0]||'',puntaje:1,justificar:false});drawEd()}
function qDe(i){head();ED.preguntas.splice(i,1);drawEd()}
const evSave=()=>T(async()=>{head();await api('evalGuardar',{ev:ED});alert('Guardado');vEv()});

/* ===== ADMIN: RESULTADOS ===== */
async function vRes(){const ev=await api('evals');$('m').innerHTML=`<div class="card"><h2>Resultados y ranking</h2>Evaluación<select id="re" onchange="loadRes()">${ev.map(e=>`<option value="${e.id}">${esc(e.titulo)}</option>`).join('')}</select><div id="rl"></div></div><div id="rd"></div>`;if(ev.length)loadRes()}
let RL=[];
async function loadRes(){RL=await api('intentos',{evalId:$('re').value});$('rl').innerHTML=`<table><tr><th>#</th><th>Funcionario</th><th>Inicio</th><th>Término</th><th>Puntaje</th><th>%</th><th>Nota</th><th>Estado</th><th>Alertas</th><th></th></tr>${RL.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nombre)}</td><td>${fd(r.inicio)}</td><td>${fd(r.fin)}</td><td>${r.obt}/${r.max}</td><td>${r.pct}</td><td><b>${r.nota}</b></td><td>${r.estado}</td><td>${r.alertas>0?`<span class="no">${r.alertas}</span>`:0}</td><td><button class="b s" onclick="verInf('${r.id}',true)">Revisar</button> <button class="b s r" onclick="reab('${r.id}')">Reabrir</button></td></tr>`).join('')}</table>`}
const reab=id=>{if(confirm('Se borrará el intento para que el funcionario rinda de nuevo. ¿Continuar?'))T(async()=>{await api('reabrir',{id});loadRes()})};
let RP=null;
async function verInf(id,adm){RP=await api('informe',{id});const r=RP,A=adm;
  const html=`<div class="card"><img src="logo.png" height="50"><h2>${esc(r.eval.titulo)}</h2><b>${esc(r.nombre)}</b> · ${fd(r.inicio)} → ${fd(r.fin)} (${dur((r.fin-r.inicio)/1000)})<p><b>Objetivo(s):</b> ${esc(r.eval.objetivos)}</p><p><b>Habilidades:</b> ${r.eval.habilidades.map(h=>`<span class="tag">${esc(h)}</span>`).join('')}</p>
<div class="row"><div><div class="nota">${r.nota}</div>Nota (escala 1.0–7.0, 60% exigencia)</div><div><b>${r.obt}/${r.max}</b> puntos · ${r.preguntas.filter(p=>p.tipo!='DES'&&p.pts>0).length} buenas · ${r.preguntas.filter(p=>p.tipo!='DES'&&!p.pts).length} malas<br>Lugar <b>${r.pos}</b> de ${r.total}</div></div></div>
<div class="card"><h3>Nivel de logro por habilidad</h3>${r.habilidades.map(h=>`<div>${esc(h.h)} — <b>${h.pct}%</b> (${h.obt}/${h.max})<div class="bar"><i style="width:${h.pct}%"></i></div></div>`).join('')}</div>
<div class="card"><h3>Detalle</h3><table><tr><th>N°</th><th>Pregunta</th><th>Respondió</th><th>Correcta</th><th>Pts</th>${A?'<th>Tiempo</th>':''}</tr>${r.preguntas.map((p,i)=>{const ds=p.tipo=='DES';return`<tr><td>${i+1}</td><td>${esc(p.enunciado)}${p.just?`<br><i>Justif.: ${esc(p.just)}</i>`:''}${A?`<br><textarea placeholder="Retroalimentación" id="rt${p.pid}">${esc(p.retro)}</textarea>`:p.retro?`<br><i>Retro: ${esc(p.retro)}</i>`:''}</td><td>${esc(ds?p.resp:txt(p,p.resp))}</td><td>${esc(ds?(A?p.correcta:''):txt(p,p.correcta))}</td><td>${ds&&A?`<input type="number" id="pt${p.pid}" min="0" max="${p.puntaje}" value="${p.pts}" style="width:60px">/${p.puntaje}`:`<span class="${p.pts>0?'ok':'no'}">${p.pts}/${p.puntaje}</span>`}</td>${A?`<td>${dur(p.seg)}</td>`:''}</tr>`}).join('')}</table>
${A?`Retroalimentación general<textarea id="rg">${esc(r.retro)}</textarea><button class="b v" onclick="guardaRev('${r.id}')">Guardar revisión</button> <button class="b g" onclick="iaRev()">IA: sugerir puntaje de desarrollo</button> <button class="b g" onclick="iaAn()">IA: analizar informe</button><div id="iar"></div>`:`<p><b>Retroalimentación:</b> ${esc(r.retro)}</p>`}
<button class="b" onclick="pdf(RP,${!!A})">Descargar informe PDF</button></div>
<div class="card"><h3>Ranking</h3><table>${r.ranking.map(x=>`<tr style="${x.yo?'background:#e6f1d6':''}"><td>${x.pos}</td><td>${esc(x.nombre)}</td><td>${x.pct}%</td><td>${x.nota}</td></tr>`).join('')}</table></div>
${A?`<div class="card"><h3>Alertas antifraude</h3>${(r.eventos||[]).length?`<table>${r.eventos.map(e=>`<tr><td>${fd(e.t)}</td><td>${EVL[e.k]||e.k}</td></tr>`).join('')}</table>`:'Sin alertas.'}</div>`:''}`;
  ($('rd')||$('m')).innerHTML=html;($('rd')||$('m')).scrollIntoView()}
const iaAn=()=>T(async()=>{$('iar').textContent='Analizando con IA…';const r=await api('iaAnalizar',{id:RP.id,modo:'analisis'});$('iar').innerHTML=`<div class="card" style="background:#f4f9ec"><b>Análisis IA (revíselo antes de usarlo)</b><pre style="white-space:pre-wrap;font:inherit" id="iat">${esc(r.texto)}</pre><button class="b s v" onclick="$('rg').value=$('iat').textContent">Usar como retroalimentación general</button></div>`});
const iaRev=()=>T(async()=>{$('iar').textContent='Corrigiendo con IA…';const r=await api('iaAnalizar',{id:RP.id,modo:'revisar'});(r.items||[]).forEach(x=>{const a=$('pt'+x.pid),t=$('rt'+x.pid);if(a)a.value=Math.max(0,Math.min(Number(x.pts)||0,Number(a.max)));if(t&&x.comentario)t.value=x.comentario});$('iar').textContent='Sugerencias cargadas: revíselas y pulse "Guardar revisión".'});
const EVL={tab:'Cambió de pestaña / minimizó',blur:'Perdió el foco de la ventana',copy:'Intentó copiar',cut:'Intentó cortar',paste:'Intentó pegar',menu:'Clic derecho',tecla:'Atajo de teclado bloqueado',full:'Salió de pantalla completa',fuera_de_plazo:'Envío fuera de plazo'};
function txt(p,v){if(v==='')return '(sin respuesta)';return p.tipo=='ALT'?(p.opciones[Number(v)]??v):v}
const guardaRev=id=>T(async()=>{const pts={},retros={};RP.preguntas.forEach(p=>{if(p.tipo=='DES')pts[p.pid]=$('pt'+p.pid).value;const t=$('rt'+p.pid);if(t&&t.value!==p.retro)retros[p.pid]=t.value});await api('revisar',{id,pts,retros,retro:$('rg').value});alert('Revisión guardada');verInf(id,true);if($('rl'))loadRes()});

/* ===== PROFESIONAL ===== */
async function vMis(){const l=await api('misEvals');$('m').innerHTML=`<h2>Mis evaluaciones</h2>`+(l.map(e=>`<div class="card"><h3>${esc(e.titulo)}</h3><p><b>Objetivo(s):</b> ${esc(e.objetivos)}</p><p><b>Habilidades:</b> ${e.habilidades.map(h=>`<span class="tag">${esc(h)}</span>`).join('')}</p><p>Disponible: ${fc(e.inicio)} a ${fc(e.fin)} · Duración ${e.duracion} min · Estado: <b>${e.estado}</b></p>${['Disponible','EnCurso'].includes(e.estado)?`<button class="b v" onclick="start('${e.evalId}')">${e.estado=='EnCurso'?'Continuar':'Comenzar'}</button>`:''}</div>`).join('')||'<div class="card">No tiene evaluaciones habilitadas.</div>')}
async function vInf(){const l=await api('misInformes');$('m').innerHTML=`<h2>Mis informes</h2><div class="card"><table><tr><th>Evaluación</th><th>Fecha</th><th>Nota</th><th>Estado</th><th></th></tr>${l.map(r=>`<tr><td>${esc(r.evaluacion)}</td><td>${fd(r.fin)}</td><td>${r.estado=='Revisado'?r.nota:'-'}</td><td>${r.estado}</td><td>${r.estado=='Revisado'?`<button class="b s" onclick="verInf('${r.id}',false)">Ver informe</button>`:''}</td></tr>`).join('')}</table></div>`}

/* ===== RENDICIÓN (con control de copia y salida) ===== */
const goFull=()=>{try{document.documentElement.requestFullscreen()}catch(e){}};
async function start(evalId){if(!confirm('La evaluación se rinde en pantalla completa. Salir de la ventana, copiar o pegar queda registrado. ¿Comenzar?'))return;
  T(async()=>{const d=await api('iniciar',{evalId});goFull();EX={d,i:0,ans:d.borrador||{},ev:[],t0:Date.now(),on:true};const bk=localStorage.getItem('bk'+d.intentoId);if(bk&&!Object.keys(EX.ans).length)EX.ans=JSON.parse(bk);hooks();drawQ();EX.tm=setInterval(tick,1000);EX.sv=setInterval(()=>save(),15000)})}
function log(k){if(!EX||!EX.on)return;EX.ev.push({t:Date.now(),k});if(['tab','blur','full'].includes(k))$('warn').style.display='flex';save()}
const H={visibilitychange:()=>document.hidden&&log('tab'),blur:()=>log('blur'),copy:e=>{e.preventDefault();log('copy')},cut:e=>{e.preventDefault();log('cut')},paste:e=>{e.preventDefault();log('paste')},contextmenu:e=>{e.preventDefault();log('menu')},dragstart:e=>e.preventDefault(),fullscreenchange:()=>{if(!document.fullscreenElement)log('full')},
 keydown:e=>{if((e.ctrlKey||e.metaKey)&&'cvxaspuCVXASPU'.includes(e.key)||e.key=='F12'||e.key=='PrintScreen'){e.preventDefault();log('tecla')}},beforeunload:e=>{if(EX&&EX.on){e.preventDefault();e.returnValue=''}}};
function hooks(){document.addEventListener('visibilitychange',H.visibilitychange);['blur','beforeunload'].forEach(k=>window.addEventListener(k,H[k]));['copy','cut','paste','contextmenu','dragstart','fullscreenchange','keydown'].forEach(k=>document.addEventListener(k,H[k]))}
function unhook(){document.removeEventListener('visibilitychange',H.visibilitychange);['blur','beforeunload'].forEach(k=>window.removeEventListener(k,H[k]));['copy','cut','paste','contextmenu','dragstart','fullscreenchange','keydown'].forEach(k=>document.removeEventListener(k,H[k]))}
function acum(){const q=EX.d.preguntas[EX.i],a=EX.ans[q.id]=EX.ans[q.id]||{};if(!document.hidden)a.s=(a.s||0)+(Date.now()-EX.t0)/1000;EX.t0=Date.now()}
async function save(){acum();const ev=EX.ev.splice(0);localStorage.setItem('bk'+EX.d.intentoId,JSON.stringify(EX.ans));try{await api('borrador',{id:EX.d.intentoId,ans:EX.ans,events:ev})}catch(e){EX.ev=ev.concat(EX.ev)}}
function tick(){const r=Math.max(0,EX.d.deadline-Date.now());$('cd').textContent=Math.floor(r/60000)+':'+String(Math.floor(r/1000)%60).padStart(2,'0');if(r<=0)fin(true)}
function drawQ(){const d=EX.d,q=d.preguntas[EX.i],a=EX.ans[q.id]||{};
  $('app').innerHTML=`<header><img src="logo.png"><b>${esc(d.titulo)}</b><span class="sp"></span><b>⏱ <span id="cd"></span></b></header><main class="noselect"><div class="card"><div class="nav">${d.preguntas.map((p,i)=>`<button class="${i==EX.i?'cur':''} ${EX.ans[p.id]&&EX.ans[p.id].r?'done':''}" onclick="nav(${i})">${i+1}</button>`).join('')}</div>
<small>${esc(q.seccion)}</small><h3>${EX.i+1}. ${esc(q.enunciado)}</h3>
${q.tipo=='VF'?['V','F'].map(v=>`<label class="opt ${a.r==v?'sel':''}"><input type="radio" name="o" ${a.r==v?'checked':''} onclick="ans('${v}')"> ${v=='V'?'Verdadero':'Falso'}</label>`).join('')+(q.justificar&&a.r=='F'?`<textarea placeholder="Justifique su respuesta falsa" oninput="EX.ans['${q.id}'].j=this.value">${esc(a.j||'')}</textarea>`:''):''}
${q.tipo=='ALT'?q.opciones.map((o,i)=>`<label class="opt ${a.r==i?'sel':''}"><input type="radio" name="o" ${a.r==i?'checked':''} onclick="ans('${i}')"> ${esc(o)}</label>`).join(''):''}
${q.tipo=='DES'?`<textarea style="min-height:200px" oninput="EX.ans['${q.id}'].r=this.value">${esc(a.r||'')}</textarea>`:''}
<button class="b g" ${EX.i?'':'disabled'} onclick="nav(EX.i-1)">Anterior</button> <button class="b" ${EX.i<d.preguntas.length-1?'':'disabled'} onclick="nav(EX.i+1)">Siguiente</button> <button class="b v" style="float:right" onclick="fin()">Finalizar evaluación</button></div></main>`;tick()}
function ans(v){const q=EX.d.preguntas[EX.i];EX.ans[q.id]=EX.ans[q.id]||{};EX.ans[q.id].r=v;drawQ()}
function nav(i){acum();EX.i=i;drawQ();save()}
async function fin(forzado){if(!forzado&&!confirm('¿Finalizar y enviar? No podrá modificar sus respuestas.'))return;acum();EX.on=false;clearInterval(EX.tm);clearInterval(EX.sv);
  try{await api('finalizar',{id:EX.d.intentoId,ans:EX.ans,events:EX.ev});localStorage.removeItem('bk'+EX.d.intentoId)}catch(e){alert(e.message)}
  unhook();try{document.exitFullscreen()}catch(e){}$('warn').style.display='none';EX=null;alert('Evaluación enviada. Verá su informe cuando sea revisada.');go('inf')}

/* ===== IMPORTAR Y PDF DEL INSTRUMENTO ===== */
function norm(r){const h=(r.habilidades||[]).map(String);return{titulo:r.titulo||'',objetivos:r.objetivos||'',habilidades:h,duracion:60,preguntas:(r.preguntas||[]).map(p=>({seccion:p.seccion||'',tipo:['VF','ALT','DES'].includes(p.tipo)?p.tipo:'VF',enunciado:p.enunciado||'',opciones:p.opciones||[],correcta:String(p.correcta??''),habilidad:h.includes(p.habilidad)?p.habilidad:(h[0]||''),puntaje:p.puntaje||1,justificar:!!p.justificar}))}}
async function imp(inp){const f=inp.files[0];inp.value='';if(!f)return;T(async()=>{let t='';const b=await f.arrayBuffer();
  if(/\.docx$/i.test(f.name))t=(await mammoth.extractRawText({arrayBuffer:b})).value;
  else if(/\.pdf$/i.test(f.name)){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const d=await pdfjsLib.getDocument({data:b}).promise;for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent();t+=c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n'}}
  else throw Error('Use un archivo .docx o .pdf');
  if(t.length>24000&&!confirm('El texto es largo: se procesarán solo los primeros 24.000 caracteres. ¿Continuar?'))return;
  $('ed').innerHTML='<div class="card">Procesando con IA, espere unos segundos…</div>';
  ED=norm(await api('importar',{texto:t}));drawEd();$('ed').insertAdjacentHTML('afterbegin','<div class="card no">Borrador importado con IA: revise enunciados, clave de respuestas, objetivo(s) y habilidades antes de guardar.</div>');$('ed').scrollIntoView()})}
async function pdfInst(id,pauta){const e=EV.find(x=>x.id==id),{jsPDF}=window.jspdf,d=new jsPDF(),lg=await logoData();let y=36;
  const P=(t,b,x)=>{d.setFont('helvetica',b?'bold':'normal').setFontSize(b?11:9.5);const l=d.splitTextToSize(String(t),182-(x||0));if(y+l.length*4.6>278){d.addPage();y=36}d.text(l,14+(x||0),y);y+=l.length*4.6+1.5};
  P(e.titulo,1);if(pauta)P('PAUTA DE CORRECCIÓN – USO EXCLUSIVO DE LA ADMINISTRACIÓN',1);
  P('Nombre: ______________________________   Fecha: ____________   Puntaje: ________');P('Objetivo(s): '+e.objetivos);P('Habilidades: '+JSON.parse(e.habilidades).join('; '));P('Duración: '+e.duracion+' min · Exigencia 60% · Escala 1.0 a 7.0');
  let sec='';e.preguntas.forEach((p,i)=>{if(p.seccion!==sec){sec=p.seccion;y+=2;P(sec,1)}const op=JSON.parse(p.opciones||'[]');P((i+1)+'. '+(p.tipo=='VF'?'____ ':'')+p.enunciado);
    if(p.tipo=='ALT')op.forEach((o,k)=>P(String.fromCharCode(97+k)+') '+o,0,6));
    if(p.tipo=='DES'&&!pauta){P('_'.repeat(95));P('_'.repeat(95));P('_'.repeat(95))}
    if(pauta)P('► Correcta: '+(p.tipo=='ALT'?String.fromCharCode(97+Number(p.correcta))+') '+(op[Number(p.correcta)]??''):p.correcta)+'  ·  '+p.habilidad+'  ·  '+p.puntaje+' pt'+(p.justificar=='TRUE'?'  ·  justificar si es F':''),0,6)});
  const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.addImage(lg,'PNG',14,8,32,13);d.setFontSize(12).setTextColor(31,81,146).text(pauta?'INSTRUMENTO CON PAUTA':'INSTRUMENTO DE EVALUACIÓN',200,16,{align:'right'});d.setDrawColor(141,198,63).setLineWidth(1).line(14,25,196,25);d.setFontSize(8).setTextColor(100).text('SIRAK Servicios Clínicos Integrales · Austria 2066, Providencia · Pág. '+i+'/'+n,105,290,{align:'center'});d.setTextColor(0)}
  d.save((pauta?'Pauta_':'Instrumento_')+e.titulo.replace(/\s+/g,'_')+'.pdf')}

/* ===== PDF ===== */
const logoData=()=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;c.getContext('2d').drawImage(i,0,0);r(c.toDataURL('image/png'))};i.src='logo.png'});
async function pdf(r,adm){const{jsPDF}=window.jspdf,d=new jsPDF(),lg=await logoData(),M={top:34,bottom:16,left:14,right:14},tb=(o)=>d.autoTable({margin:M,styles:{fontSize:8,cellPadding:1.6},headStyles:{fillColor:[31,81,146]},...o});
  let y=38;const P=(t,b)=>{d.setFont('helvetica',b?'bold':'normal').setFontSize(b?11:9);const l=d.splitTextToSize(t,182);if(y+l.length*4.5>280){d.addPage();y=38}d.text(l,14,y);y+=l.length*4.5+(b?1:2)};
  P(r.eval.titulo,1);P('Funcionario/a: '+r.nombre);P('Inicio: '+fd(r.inicio)+'   Término: '+fd(r.fin)+'   Duración: '+dur((r.fin-r.inicio)/1000));P('Objetivo(s): '+r.eval.objetivos);P('Habilidades: '+r.eval.habilidades.join('; '));
  P(`Puntaje: ${r.obt}/${r.max}   Nota: ${r.nota} (escala 1.0-7.0, 60% de exigencia)   Lugar: ${r.pos} de ${r.total}`,1);
  tb({startY:y,head:[['Habilidad','Puntos','Logro %']],body:r.habilidades.map(h=>[h.h,h.obt+'/'+h.max,h.pct+'%'])});
  tb({startY:d.lastAutoTable.finalY+5,head:[['N°','Pregunta','Respuesta dada','Correcta','Pts'].concat(adm?['Tiempo']:[])],body:r.preguntas.map((p,i)=>{const ds=p.tipo=='DES';return[i+1,p.enunciado+(p.just?'\nJustif.: '+p.just:'')+(p.retro?'\nRetro: '+p.retro:''),txt(p,p.resp),ds?(adm?p.correcta:''):txt(p,p.correcta),p.pts+'/'+p.puntaje].concat(adm?[dur(p.seg)]:[])}),columnStyles:{1:{cellWidth:adm?80:90}}});
  if(r.retro){y=d.lastAutoTable.finalY+6;P('Retroalimentación: '+r.retro)}
  tb({startY:d.lastAutoTable.finalY+(r.retro?14:6),head:[['Lugar','Funcionario','Logro %','Nota']],body:r.ranking.map(x=>[x.pos,x.nombre,x.pct+'%',x.nota])});
  if(adm&&r.eventos&&r.eventos.length)tb({startY:d.lastAutoTable.finalY+6,head:[['Hora','Alerta antifraude']],body:r.eventos.map(e=>[fd(e.t),EVL[e.k]||e.k])});
  const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.addImage(lg,'PNG',14,8,32,13);d.setFontSize(12).setTextColor(31,81,146).text(adm?'INFORME DE EVALUACIÓN (Administración)':'INFORME DE RESULTADOS',200,16,{align:'right'});d.setDrawColor(141,198,63).setLineWidth(1).line(14,25,196,25);d.setFontSize(8).setTextColor(100).text('SIRAK Servicios Clínicos Integrales · Austria 2066, Providencia · Generado '+new Date().toLocaleString('es-CL')+' · Pág. '+i+'/'+n,105,290,{align:'center'})}
  d.save('Informe_'+r.nombre.replace(/\s+/g,'_')+'.pdf')}
boot();
</script></body></html>
